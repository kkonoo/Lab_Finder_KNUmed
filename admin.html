<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>인턴십 신청 관리</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="form.css">
</head>
<body>
<main class="sheet admin">
  <div class="bar-top">
    <div><p class="label">경북대학교 융합형 의사과학자 양성사업단</p><h2>인턴십 신청 관리</h2></div>
    <p id="account" hidden><small id="accountEmail"></small> <button class="btn" id="logoutBtn" type="button">로그아웃</button></p>
  </div>

  <div id="gate" class="gate" hidden></div>

  <div id="app" hidden>
    <div class="tabs" role="tablist">
      <button class="chip on" type="button" role="tab" data-tab="apps">신청</button>
      <button class="chip" type="button" role="tab" data-tab="labs">보여 줄 교수님</button>
      <button class="chip" type="button" role="tab" data-tab="admins">관리자</button>
    </div>

    <section data-panel="apps">
    <div class="filters">
      <select id="fRound" aria-label="회차"></select>
      <select id="fTrack" aria-label="트랙"></select>
      <select id="fStatus" aria-label="상태"></select>
      <span class="grow"></span>
      <button class="btn" id="refreshBtn" type="button">새로 고침</button>
      <button class="btn" id="csvBtn" type="button">CSV 받기</button>
    </div>
    <div class="table-wrap">
      <table class="list">
        <thead><tr><th>신청</th><th>이름</th><th>학년</th><th>트랙</th><th>희망 연구실</th><th>스타일</th><th>상태</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    </section>

    <section data-panel="labs" hidden>
      <p class="hint">끈 교수님은 연구실 찾기의 카드·테스트 추천과 신청서의 연구실 목록에서 빠져요. 누르면 바로 저장돼요. 인쇄용 PDF에는 모두 나와요.</p>
      <div class="filters">
        <span id="labCount"></span>
        <span class="grow"></span>
        <button class="btn" id="allOnBtn" type="button">모두 켜기</button>
        <button class="btn" id="allOffBtn" type="button">모두 끄기</button>
      </div>
      <div id="labGroups"></div>
    </section>

    <section data-panel="admins" hidden>
      <p class="hint">여기 있는 구글 계정만 신청서를 보고 교수님을 켜고 꺼요.</p>
      <ul class="admins" id="adminList"></ul>
      <form id="adminForm" class="inline">
        <input name="email" type="email" required placeholder="구글 계정 이메일" aria-label="추가할 관리자 이메일">
        <button class="btn" type="submit">추가</button>
      </form>
    </section>
  </div>
</main>

<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <h3 id="dlgTitle"></h3>
    <dl class="info" id="info"></dl>
    <textarea name="note" rows="3" maxlength="2000" placeholder="메모 (관리자만 봐요)" aria-label="메모"></textarea>
    <div class="actions">
      <button class="btn primary" value="approved">선정</button>
      <button class="btn" value="rejected">미선정</button>
      <button class="btn" value="submitted">접수로 되돌리기</button>
      <button class="btn danger" type="button" id="deleteBtn">삭제</button>
      <button class="btn" value="cancel">닫기</button>
    </div>
  </form>
</dialog>
<p id="toast" class="toast" role="status" hidden></p>
<script type="module" src="js/admin.js"></script>
</body>
</html>
